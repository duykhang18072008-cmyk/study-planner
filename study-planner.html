<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kế hoạch học tập</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--bd:#e2e6ef;--ac:#4f46e5;--ok:#16a34a;--wr:#dc2626;--md:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2a3145;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2a3145;--ac:#818cf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-size:1.4rem}
.stats span{color:var(--mu);font-size:.8rem}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .full{grid-column:1/-1}
input,select,button{font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
button{cursor:pointer}
.pri{background:var(--ac);color:#fff;border:0;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.task:last-child{border:0}
.task .in{flex:1;min-width:0}
.task .t{font-weight:600;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--mu)}
.meta{font-size:.8rem;color:var(--mu);margin-top:2px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:.72rem;color:#fff}
.cao{background:var(--wr)}.tb{background:var(--md)}.thap{background:var(--ok)}
.late{color:var(--wr);font-weight:600}
.x{border:0;background:none;color:var(--mu);font-size:1.1rem}
.empty{text-align:center;color:var(--mu);padding:18px}
</style>
</head>
<body>
<main>
<h1>📚 Kế hoạch học tập cá nhân</h1>
<p class="sub">Quản lý môn học, deadline và tiến độ của bạn.</p>

<div class="card">
  <div class="stats"><div><b id="s1">0</b><span>Tổng việc</span></div><div><b id="s2">0</b><span>Đã xong</span></div><div><b id="s3">0</b><span>Quá hạn</span></div></div>
  <div class="bar"><i id="bar"></i></div>
</div>

<div class="card">
  <form id="f">
    <input class="full" id="title" placeholder="Công việc (vd: Ôn chương 3 Giải tích)" required>
    <input id="subject" placeholder="Môn học" required>
    <input id="due" type="date" required>
    <select id="pri"><option value="cao">Ưu tiên cao</option><option value="tb" selected>Trung bình</option><option value="thap">Thấp</option></select>
    <button class="pri" type="submit">+ Thêm</button>
  </form>
</div>

<div class="card">
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">Tất cả</button><button data-f="todo">Chưa xong</button><button data-f="done">Đã xong</button>
  </div>
  <div id="list"></div>
</div>
</main>
<script>
var KEY="studyplan-v1",tasks=[],filter="all";
try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var names={cao:"Cao",tb:"Trung bình",thap:"Thấp"};
function render(){
  var today=new Date().toISOString().slice(0,10);
  var done=tasks.filter(function(t){return t.done}).length;
  var late=tasks.filter(function(t){return !t.done&&t.due<today}).length;
  s1.textContent=tasks.length;s2.textContent=done;s3.textContent=late;
  bar.style.width=(tasks.length?done/tasks.length*100:0)+"%";
  var v=tasks.filter(function(t){return filter=="all"||(filter=="done")==t.done});
  v.sort(function(a,b){return a.done-b.done||a.due.localeCompare(b.due)});
  list.innerHTML=v.length?v.map(function(t){
    var l=!t.done&&t.due<today;
    return '<div class="task'+(t.done?' done':'')+'"><input type="checkbox" data-c="'+t.id+'"'+(t.done?' checked':'')+'><div class="in"><div class="t">'+esc(t.title)+'</div><div class="meta">'+esc(t.subject)+' · <span class="'+(l?'late':'')+'">Hạn '+t.due.split("-").reverse().join("/")+(l?' (quá hạn)':'')+'</span> · <span class="tag '+t.pri+'">'+names[t.pri]+'</span></div></div><button class="x" data-d="'+t.id+'" aria-label="Xoá">✕</button></div>'
  }).join(""):'<div class="empty">Chưa có công việc nào.</div>';
}
f.onsubmit=function(e){e.preventDefault();
  tasks.push({id:Date.now(),title:title.value.trim(),subject:subject.value.trim(),due:due.value,pri:pri.value,done:false});
  save();f.reset();pri.value="tb";render()};
list.onclick=function(e){var c=e.target.dataset.c,d=e.target.dataset.d;
  if(c){tasks.forEach(function(t){if(t.id==c)t.done=!t.done});save();render()}
  if(d){tasks=tasks.filter(function(t){return t.id!=d});save();render()}};
tabs.onclick=function(e){if(!e.target.dataset.f)return;filter=e.target.dataset.f;
  [].forEach.call(tabs.children,function(b){b.classList.toggle("on",b==e.target)});render()};
due.value=new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
